name: Release

on:
  push:
    tags:
      - 'v*'
      - 'seance-v*'
      - 'familiar-v*'
      - 'omen-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g., v0.1.0 or seance-v0.1.0)'
        required: true

jobs:
  build:
    name: Build ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          # mitt
          - app: mitt
            os: macos-latest
            zig_target: aarch64-macos
            artifact: mitt-macos-aarch64
          - app: mitt
            os: macos-latest
            zig_target: x86_64-macos
            artifact: mitt-macos-x86_64
          - app: mitt
            os: ubuntu-latest
            zig_target: x86_64-linux
            artifact: mitt-linux-x86_64
          - app: mitt
            os: ubuntu-latest
            zig_target: aarch64-linux
            artifact: mitt-linux-aarch64
          # seance
          - app: seance
            os: macos-latest
            zig_target: aarch64-macos
            artifact: seance-macos-aarch64
          - app: seance
            os: macos-latest
            zig_target: x86_64-macos
            artifact: seance-macos-x86_64
          - app: seance
            os: ubuntu-latest
            zig_target: x86_64-linux
            artifact: seance-linux-x86_64
          - app: seance
            os: ubuntu-latest
            zig_target: aarch64-linux
            artifact: seance-linux-aarch64
          # familiar
          - app: familiar
            os: macos-latest
            zig_target: aarch64-macos
            artifact: familiar-macos-aarch64
          - app: familiar
            os: macos-latest
            zig_target: x86_64-macos
            artifact: familiar-macos-x86_64
          - app: familiar
            os: ubuntu-latest
            zig_target: x86_64-linux
            artifact: familiar-linux-x86_64
          - app: familiar
            os: ubuntu-latest
            zig_target: aarch64-linux
            artifact: familiar-linux-aarch64
          # omen
          - app: omen
            os: macos-latest
            zig_target: aarch64-macos
            artifact: omen-macos-aarch64
          - app: omen
            os: macos-latest
            zig_target: x86_64-macos
            artifact: omen-macos-x86_64
          - app: omen
            os: ubuntu-latest
            zig_target: x86_64-linux
            artifact: omen-linux-x86_64
          - app: omen
            os: ubuntu-latest
            zig_target: aarch64-linux
            artifact: omen-linux-aarch64

    steps:
      - name: Check if this app should build
        id: check
        run: |
          TAG="${{ github.ref_name }}"
          APP="${{ matrix.app }}"
          if [[ "$TAG" == seance-v* && "$APP" == "seance" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == familiar-v* && "$APP" == "familiar" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == omen-v* && "$APP" == "omen" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == v* && ! "$TAG" == seance-v* && ! "$TAG" == familiar-v* && ! "$TAG" == omen-v* && "$APP" == "mitt" ]]; then
            echo "should_build=true" >> $GITHUB_OUTPUT
          else
            echo "should_build=false" >> $GITHUB_OUTPUT
          fi

      - name: Checkout code
        if: steps.check.outputs.should_build == 'true'
        uses: actions/checkout@v4

      - name: Setup Zig
        if: steps.check.outputs.should_build == 'true'
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.15.2

      - name: Build
        if: steps.check.outputs.should_build == 'true'
        run: zig build -Dtarget=${{ matrix.zig_target }} -Doptimize=ReleaseSafe

      - name: Package binary
        if: steps.check.outputs.should_build == 'true'
        run: |
          mkdir -p dist
          cp zig-out/bin/${{ matrix.app }} dist/
          cd dist
          tar -czf ${{ matrix.artifact }}.tar.gz ${{ matrix.app }}
          sha256sum ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256 2>/dev/null || shasum -a 256 ${{ matrix.artifact }}.tar.gz > ${{ matrix.artifact }}.tar.gz.sha256

      - name: Upload artifact
        if: steps.check.outputs.should_build == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Determine app from tag
        id: app
        run: |
          TAG="${{ github.ref_name }}"
          if [[ "$TAG" == seance-v* ]]; then
            echo "name=seance" >> $GITHUB_OUTPUT
            echo "version=${TAG#seance-}" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == familiar-v* ]]; then
            echo "name=familiar" >> $GITHUB_OUTPUT
            echo "version=${TAG#familiar-}" >> $GITHUB_OUTPUT
          elif [[ "$TAG" == omen-v* ]]; then
            echo "name=omen" >> $GITHUB_OUTPUT
            echo "version=${TAG#omen-}" >> $GITHUB_OUTPUT
          else
            echo "name=mitt" >> $GITHUB_OUTPUT
            echo "version=$TAG" >> $GITHUB_OUTPUT
          fi

      - name: Create release notes
        run: |
          APP="${{ steps.app.outputs.name }}"
          if [ "$APP" = "seance" ]; then
            cat > release_notes.md << 'EOF'
          # seance ${{ github.ref_name }}

          Ephemeral encrypted P2P group chat. No accounts, no history, no cloud.

          ## Installation

          ### Homebrew (macOS/Linux)
          ```bash
          brew tap no-way-labs/cauldron
          brew install seance
          ```

          ### Manual Installation
          Download the appropriate binary for your platform below and extract it.

          ## SHA256 Checksums
          EOF
          elif [ "$APP" = "familiar" ]; then
            cat > release_notes.md << 'EOF'
          # familiar ${{ github.ref_name }}

          Autonomous Claude-powered chat bot for seance rooms.

          ## Installation

          ### Manual Installation
          Download the appropriate binary for your platform below and extract it.

          ## SHA256 Checksums
          EOF
          elif [ "$APP" = "omen" ]; then
            cat > release_notes.md << 'EOF'
          # omen ${{ github.ref_name }}

          Anonymous encrypted voting CLI. No accounts, no history, no cloud.

          ## Installation

          ### Manual Installation
          Download the appropriate binary for your platform below and extract it.

          ## SHA256 Checksums
          EOF
          else
            cat > release_notes.md << 'EOF'
          # mitt ${{ github.ref_name }}

          An encrypted file transfer CLI tool.

          ## Installation

          ### Homebrew (macOS/Linux)
          ```bash
          brew tap no-way-labs/cauldron
          brew install mitt
          ```

          ### Manual Installation
          Download the appropriate binary for your platform below and extract it.

          ## SHA256 Checksums
          EOF
          fi

          for file in artifacts/*/*.sha256; do
            [ -f "$file" ] && cat "$file" >> release_notes.md
          done

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: artifacts/*/*.tar.gz
          body_path: release_notes.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout homebrew tap
        if: steps.app.outputs.name != 'familiar' && steps.app.outputs.name != 'omen'
        uses: actions/checkout@v4
        with:
          repository: no-way-labs/homebrew-cauldron
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        if: steps.app.outputs.name != 'familiar' && steps.app.outputs.name != 'omen'
        run: |
          APP="${{ steps.app.outputs.name }}"
          TAG="${{ github.ref_name }}"
          VERSION="${{ steps.app.outputs.version }}"

          if [ "$APP" = "seance" ]; then
            ARM64_SHA=$(cat artifacts/seance-macos-aarch64/*.sha256 | awk '{print $1}')
            X86_64_SHA=$(cat artifacts/seance-macos-x86_64/*.sha256 | awk '{print $1}')
            LINUX_ARM64_SHA=$(cat artifacts/seance-linux-aarch64/*.sha256 | awk '{print $1}')
            LINUX_X86_64_SHA=$(cat artifacts/seance-linux-x86_64/*.sha256 | awk '{print $1}')

            sed -i "s/version \".*\"/version \"${VERSION#v}\"/" homebrew-tap/Formula/seance.rb
            sed -i "s|download/seance-v[0-9.]*\/|download/$TAG/|g" homebrew-tap/Formula/seance.rb
            sed -i "/seance-macos-aarch64.tar.gz/,/sha256/ s/sha256 \".*\"/sha256 \"$ARM64_SHA\"/" homebrew-tap/Formula/seance.rb
            sed -i "/seance-macos-x86_64.tar.gz/,/sha256/ s/sha256 \".*\"/sha256 \"$X86_64_SHA\"/" homebrew-tap/Formula/seance.rb
            sed -i "/seance-linux-aarch64.tar.gz/,/sha256/ s/sha256 \".*\"/sha256 \"$LINUX_ARM64_SHA\"/" homebrew-tap/Formula/seance.rb
            sed -i "/seance-linux-x86_64.tar.gz/,/sha256/ s/sha256 \".*\"/sha256 \"$LINUX_X86_64_SHA\"/" homebrew-tap/Formula/seance.rb
          else
            ARM64_SHA=$(cat artifacts/mitt-macos-aarch64/*.sha256 | awk '{print $1}')
            X86_64_SHA=$(cat artifacts/mitt-macos-x86_64/*.sha256 | awk '{print $1}')
            LINUX_ARM64_SHA=$(cat artifacts/mitt-linux-aarch64/*.sha256 | awk '{print $1}')
            LINUX_X86_64_SHA=$(cat artifacts/mitt-linux-x86_64/*.sha256 | awk '{print $1}')

            sed -i "s/version \".*\"/version \"${VERSION#v}\"/" homebrew-tap/Formula/mitt.rb
            sed -i "s|download/v[0-9.]*\/|download/$VERSION/|g" homebrew-tap/Formula/mitt.rb
            sed -i "/mitt-macos-aarch64.tar.gz/,/sha256/ s/sha256 \".*\"/sha256 \"$ARM64_SHA\"/" homebrew-tap/Formula/mitt.rb
            sed -i "/mitt-macos-x86_64.tar.gz/,/sha256/ s/sha256 \".*\"/sha256 \"$X86_64_SHA\"/" homebrew-tap/Formula/mitt.rb
            sed -i "/mitt-linux-aarch64.tar.gz/,/sha256/ s/sha256 \".*\"/sha256 \"$LINUX_ARM64_SHA\"/" homebrew-tap/Formula/mitt.rb
            sed -i "/mitt-linux-x86_64.tar.gz/,/sha256/ s/sha256 \".*\"/sha256 \"$LINUX_X86_64_SHA\"/" homebrew-tap/Formula/mitt.rb
          fi

      - name: Push updated formula
        if: steps.app.outputs.name != 'familiar' && steps.app.outputs.name != 'omen'
        run: |
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "Update ${{ steps.app.outputs.name }} formula for ${{ github.ref_name }}"
          git push
