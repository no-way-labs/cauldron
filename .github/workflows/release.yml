name: Release

on:
  push:
    tags:
      - "v*"
      - "seance-v*"
      - "familiar-v*"
      - "omen-v*"
      - "covenant-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing immutable tag to release (for example v0.5.0 or seance-v0.3.0)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  metadata:
    name: Validate release tag
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.release.outputs.app }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Resolve app and version
        id: release
        shell: bash
        env:
          REQUESTED_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
        run: |
          set -euo pipefail
          tag="$REQUESTED_TAG"
          if [[ "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            app="mitt"
            version="${BASH_REMATCH[1]}"
          elif [[ "$tag" =~ ^(seance|familiar|omen|covenant)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            app="${BASH_REMATCH[1]}"
            version="${BASH_REMATCH[2]}"
          else
            echo "Invalid release tag: $tag" >&2
            exit 1
          fi
          echo "app=$app" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate immutable tag exists
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.release.outputs.tag }}

  build:
    name: Build ${{ matrix.artifact }}
    needs: metadata
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { app: mitt, goos: darwin, goarch: arm64, artifact: mitt-macos-aarch64 }
          - { app: mitt, goos: darwin, goarch: amd64, artifact: mitt-macos-x86_64 }
          - { app: mitt, goos: linux, goarch: arm64, artifact: mitt-linux-aarch64 }
          - { app: mitt, goos: linux, goarch: amd64, artifact: mitt-linux-x86_64 }
          - { app: seance, goos: darwin, goarch: arm64, artifact: seance-macos-aarch64 }
          - { app: seance, goos: darwin, goarch: amd64, artifact: seance-macos-x86_64 }
          - { app: seance, goos: linux, goarch: arm64, artifact: seance-linux-aarch64 }
          - { app: seance, goos: linux, goarch: amd64, artifact: seance-linux-x86_64 }
          - { app: familiar, goos: darwin, goarch: arm64, artifact: familiar-macos-aarch64 }
          - { app: familiar, goos: darwin, goarch: amd64, artifact: familiar-macos-x86_64 }
          - { app: familiar, goos: linux, goarch: arm64, artifact: familiar-linux-aarch64 }
          - { app: familiar, goos: linux, goarch: amd64, artifact: familiar-linux-x86_64 }
          - { app: omen, goos: darwin, goarch: arm64, artifact: omen-macos-aarch64 }
          - { app: omen, goos: darwin, goarch: amd64, artifact: omen-macos-x86_64 }
          - { app: omen, goos: linux, goarch: arm64, artifact: omen-linux-aarch64 }
          - { app: omen, goos: linux, goarch: amd64, artifact: omen-linux-x86_64 }
          - { app: covenant, goos: darwin, goarch: arm64, artifact: covenant-macos-aarch64 }
          - { app: covenant, goos: darwin, goarch: amd64, artifact: covenant-macos-x86_64 }
          - { app: covenant, goos: linux, goarch: arm64, artifact: covenant-linux-aarch64 }
          - { app: covenant, goos: linux, goarch: amd64, artifact: covenant-linux-x86_64 }
    steps:
      - name: Checkout immutable tag
        if: matrix.app == needs.metadata.outputs.app
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Set up Go
        if: matrix.app == needs.metadata.outputs.app
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build static binary
        if: matrix.app == needs.metadata.outputs.app
        shell: bash
        env:
          APP: ${{ matrix.app }}
          VERSION: ${{ needs.metadata.outputs.version }}
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          mkdir -p dist
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "dist/$APP" "./cmd/$APP"

      - name: Verify injected version
        if: matrix.app == needs.metadata.outputs.app && matrix.goos == 'linux' && matrix.goarch == 'amd64'
        shell: bash
        env:
          APP: ${{ matrix.app }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          output="$("dist/$APP" --version 2>&1)"
          echo "$output"
          grep -F "$VERSION" <<<"$output"

      - name: Package binary and checksum
        if: matrix.app == needs.metadata.outputs.app
        shell: bash
        env:
          APP: ${{ matrix.app }}
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          cd dist
          cp ../LICENSE ../THIRD_PARTY_NOTICES .
          tar -czf "$ARTIFACT.tar.gz" "$APP" LICENSE THIRD_PARTY_NOTICES
          sha256sum "$ARTIFACT.tar.gz" > "$ARTIFACT.tar.gz.sha256"

      - name: Upload artifact
        if: matrix.app == needs.metadata.outputs.app
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: error
          path: |
            dist/${{ matrix.artifact }}.tar.gz
            dist/${{ matrix.artifact }}.tar.gz.sha256

  release:
    name: Publish ${{ needs.metadata.outputs.tag }}
    needs: [metadata, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout immutable tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.metadata.outputs.tag }}

      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release notes
        shell: bash
        env:
          APP: ${{ needs.metadata.outputs.app }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          case "$APP" in
            mitt) description="Encrypted, ephemeral file and data transfer." ;;
            seance) description="Ephemeral encrypted group chat with a loopback bot API." ;;
            familiar) description="Claude-powered participant for seance rooms." ;;
            omen) description="Encrypted, verifiable commit-reveal voting. The v1 artifact is linkable and does not provide ballot anonymity." ;;
            covenant) description="Mutually signed membership ceremonies and strict artifact verification." ;;
          esac
          {
            echo "# $APP $VERSION"
            echo
            echo "$description"
            echo
            echo "Download the archive for your platform, verify its SHA-256 sidecar, and extract the binary. See the repository README and SECURITY.md for usage and threat-model details."
            echo
            echo "## SHA-256 checksums"
            echo '```text'
            find artifacts -name '*.sha256' -type f -exec cat {} + | sort
            echo '```'
          } > release_notes.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.metadata.outputs.tag }}
          files: |
            artifacts/*/*.tar.gz
            artifacts/*/*.sha256
          body_path: release_notes.md
          draft: false
          prerelease: false

      - name: Checkout Homebrew tap
        uses: actions/checkout@v4
        with:
          repository: no-way-labs/homebrew-cauldron
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Update Homebrew formula
        shell: bash
        env:
          APP: ${{ needs.metadata.outputs.app }}
          TAG: ${{ needs.metadata.outputs.tag }}
          VERSION: ${{ needs.metadata.outputs.version }}
        run: |
          set -euo pipefail
          formula="homebrew-tap/Formula/$APP.rb"
          if [ ! -f "$formula" ]; then
            echo "No formula for $APP; skipping formula update." >&2
            echo "skip_formula=true" >> "$GITHUB_ENV"
            exit 0
          fi

          arm64_sha="$(awk '{print $1}' artifacts/$APP-macos-aarch64/*.sha256)"
          x86_64_sha="$(awk '{print $1}' artifacts/$APP-macos-x86_64/*.sha256)"
          linux_arm64_sha="$(awk '{print $1}' artifacts/$APP-linux-aarch64/*.sha256)"
          linux_x86_64_sha="$(awk '{print $1}' artifacts/$APP-linux-x86_64/*.sha256)"

          sed -i "s/version \".*\"/version \"$VERSION\"/" "$formula"
          sed -i "s|download/[^/]*/|download/$TAG/|g" "$formula"
          sed -i "/$APP-macos-aarch64.tar.gz/,/sha256/ s/sha256 \".*\"/sha256 \"$arm64_sha\"/" "$formula"
          sed -i "/$APP-macos-x86_64.tar.gz/,/sha256/ s/sha256 \".*\"/sha256 \"$x86_64_sha\"/" "$formula"
          sed -i "/$APP-linux-aarch64.tar.gz/,/sha256/ s/sha256 \".*\"/sha256 \"$linux_arm64_sha\"/" "$formula"
          sed -i "/$APP-linux-x86_64.tar.gz/,/sha256/ s/sha256 \".*\"/sha256 \"$linux_x86_64_sha\"/" "$formula"
          if [ "$APP" = "omen" ]; then
            sed -i 's/^  desc ".*"$/  desc "Encrypted, verifiable commit-reveal voting CLI"/' "$formula"
          fi

      - name: Push updated formula
        if: env.skip_formula != 'true'
        shell: bash
        env:
          APP: ${{ needs.metadata.outputs.app }}
          TAG: ${{ needs.metadata.outputs.tag }}
        run: |
          set -euo pipefail
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "Formula/$APP.rb"
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "Formula/$APP.rb is already current; nothing to push."
            exit 0
          fi
          git commit -m "Update $APP formula for $TAG"
          git push
